<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graad 6 Afrikaans Safari Avontuur</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="safari-animals-container">
        <img src="https://freepngimg.com/thumb/lion/7-lion-png-image-image-download-picture-lions.png" alt="Lion" class="safari-animal" id="animal-lion">
        <img src="https://freepngimg.com/thumb/elephant/3-2-elephant-free-download-png.png" alt="Elephant" class="safari-animal" id="animal-elephant">
        <img src="https://freepngimg.com/thumb/giraffe/175941-giraffe-png-free-photo.png" alt="Giraffe" class="safari-animal" id="animal-giraffe">
        <img src="https://freepngimg.com/thumb/zebra/8-2-zebra-png-image.png" alt="Zebra" class="safari-animal" id="animal-zebra">
    </div>
    <header>
        <h1>Welkom by die Safari Avontuur!</h1>
    </header>
    <nav>
        <button id="back-btn" class="hidden">Terug</button>
        <button id="home-btn" class="hidden">Tuis</button>
        <button id="forward-btn" class="hidden">Vorentoe</button>
    </nav>
    <main>
        <div id="topics-container">
            <h2>Kies 'n onderwerp</h2>
            <div id="topics"></div>
            <div id="badges-container">
                <h3>My Kentekens</h3>
            </div>
        </div>
        <div id="comprehension-container" class="hidden">
            <h2>Lees die teks en beantwoord die vrae</h2>
            <div id="comprehension-text"></div>
            <div id="comprehension-questions"></div>
        </div>
        <div id="quiz-container" class="hidden">
            <div id="stats-container">
                <div id="lives-container"></div>
                <div id="score-container">Score: <span id="current-score">0</span></div>
            </div>
            <div id="question-container">
                <p id="question"></p>
                <div id="options-container"></div>
            </div>
            <div id="feedback-container" class="hidden">
                <p id="feedback-text"></p>
            </div>
            <button id="next-btn">Volgende</button>
        </div>
        <div id="results-container" class="hidden">
            <h2>Resultate</h2>
            <p id="score"></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Safari Avontuur</p>
    </footer>
    <script src="js/questions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
