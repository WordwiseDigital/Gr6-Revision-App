<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graad 6 Afrikaans Safari Avontuur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welkom by die Safari Avontuur!</h1>
    </header>
    <nav>
        <button id="back-btn" class="hidden">Terug</button>
        <button id="home-btn" class="hidden">Tuis</button>
        <button id="forward-btn" class="hidden">Vorentoe</button>
    </nav>
    <main>
        <div id="topics-container">
            <h2>Kies 'n onderwerp</h2>
            <div id="topics"></div>
        </div>
        <div id="comprehension-container" class="hidden">
            <h2>Lees die teks en beantwoord die vrae</h2>
            <div id="comprehension-text"></div>
            <div id="comprehension-questions"></div>
        </div>
        <div id="quiz-container" class="hidden">
            <div id="stats-container">
                <div id="lives-container"></div>
                <div id="score-container">Score: <span id="current-score">0</span></div>
            </div>
            <div id="question-container">
                <p id="question"></p>
                <div id="options-container"></div>
            </div>
            <button id="next-btn">Volgende</button>
        </div>
        <div id="results-container" class="hidden">
            <h2>Resultate</h2>
            <p id="score"></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Safari Avontuur</p>
    </footer>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
